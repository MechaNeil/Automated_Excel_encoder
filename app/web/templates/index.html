<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Credit Application Encoder</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="shell"><header><p class="eyebrow">Operations workspace</p><h1>Credit Application Encoder</h1><p class="lede">Turn a pasted application into a traceable, editable workbook draft.</p></header><section class="panel"><label for="raw-text">Raw client information</label><textarea id="raw-text" placeholder="Paste the client information here..."></textarea><div class="actions"><button id="parse-button">Extract fields</button><span id="status">Human review is required before export.</span></div></section><section id="review-panel" class="panel hidden"><h2>Review extracted data</h2><div id="messages"></div><form id="review-form"></form><div class="generate-actions"><button id="generate-button" type="button">Generate workbook</button></div></section></main><dialog id="error-modal"><h2>Download with review issues?</h2><p>The workbook contains validation issues. Do you want to download it anyway?</p><div class="modal-actions"><button id="cancel-download" type="button">Cancel</button><button id="confirm-download" type="button">Download anyway</button></div></dialog><script src="/static/js/app.js?v=4"></script></body></html>
